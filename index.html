window.dataLayer=window.dataLayer||[]; function gtag(){dataLayer.push(arguments);}

}
/* 모든 이벤트에 공통으로 붙는 값: 계정(회원번호 또는 guest), 화면 위치, 한국 시각 */

  return {account_id:u||'guest',login_state:u?'member':'guest',page_area:area,event_time:new Date().toLocaleString('sv-SE',{timeZone:'Asia/Seoul'})};
}
function ga(name,params){ try{ gtag('event',name,Object.assign(gaCtx(),params||{})); }catch(e){} }

<style>
:root{
  --paper:#f3f2ee; --paper2:#eae8e2; --ink:#111; --ink2:#55534e; --ink3:#8d8a83; --line:#d6d3cb;
  --accent:#2b4fd8; --new:#e8432a;
  --mono:"Noto Sans KR",sans-serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#dcdad4;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
#app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:84px}
.mono{font-family:var(--mono)}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--ink);padding:14px 18px 10px;display:flex;align-items:flex-end;justify-content:space-between}
.wordmark{font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:-.02em}
.wordmark small{display:block;font-weight:400;font-size:10.5px;color:var(--ink3);letter-spacing:.02em}
.hbtn{font-family:var(--mono);font-size:11px;border:1px solid var(--ink);padding:5px 9px;border-radius:999px;background:var(--paper)}
main{padding:0 18px}
.sec{padding:22px 0 6px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sec-h h2{font-size:17px;font-weight:900;letter-spacing:-.02em}
.label{font-family:var(--mono);font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.q{font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
.q::before{content:'"'}.q::after{content:'"'}

/* mall sign */
.sign{background:#111;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--sans);font-weight:700;letter-spacing:.02em;border-radius:2px;position:relative;overflow:hidden;padding:0 8px;line-height:1.15}
.sign.new::after{content:'NEW';position:absolute;top:6px;right:6px;font-family:var(--mono);font-size:9px;font-weight:600;background:var(--new);color:#fff;padding:1px 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);padding:2px 7px;border-radius:999px;color:var(--ink2);background:transparent}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .chip{white-space:nowrap;font-size:11.5px;padding:4px 10px}

/* rec card */
.rec{display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0}
.rec .sign{height:68px;font-size:13px}
.rec .why{font-size:12px;color:var(--ink2);margin-top:3px}
.rec .why b{color:var(--ink);font-weight:700}
.bm{width:38px;height:38px;border:1px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center}
.bm svg{width:16px;height:16px}
.bm.on{background:var(--ink);color:var(--paper)}

/* new row */
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.hscroll::-webkit-scrollbar{display:none}
.tile{flex:0 0 132px}
.tile .sign{height:132px;font-size:14px}
.tile .meta{margin-top:6px;font-size:11px;color:var(--ink2);font-family:var(--mono)}

/* board card */
.bcard{border:1px solid var(--ink);background:#fff;padding:12px;margin-bottom:12px;border-radius:3px}
.bcard .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;color:#fff}
.bcard h3{font-size:15px;font-weight:900;margin-bottom:8px;letter-spacing:-.01em}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mini .sign{height:46px;font-size:10.5px}
.follow{font-family:var(--mono);font-size:11px;border:1px solid var(--ink);padding:3px 10px;border-radius:999px}
.follow.on{background:var(--ink);color:var(--paper)}
.bcard .foot{display:flex;justify-content:space-between;margin-top:9px;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}

/* bookmarks grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid .item .sign{height:110px;font-size:14px}
.grid .item .meta{display:flex;justify-content:space-between;margin-top:5px;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.addbox{display:flex;gap:8px;margin:4px 0 14px}
.addbox input{flex:1;border:1px solid var(--ink);background:#fff;padding:10px 12px;border-radius:3px;font-size:13.5px;min-width:0}
.btn{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:3px;font-weight:700;font-size:13.5px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.full{width:100%;padding:13px}
.empty{border:1px dashed var(--ink3);padding:22px;text-align:center;color:var(--ink2);font-size:13px;border-radius:3px}

/* feed */
.taste{position:sticky;top:var(--hh,68px);z-index:4;background:var(--paper);display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);margin:0 0 4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.tbar{position:relative;font-family:var(--mono);font-size:10.5px;border:1px solid var(--ink);padding:2px 8px;border-radius:999px;overflow:hidden;z-index:0}
.tbar i{position:absolute;left:0;top:0;bottom:0;background:#cfd8fb;z-index:-1;transition:width .4s}
.fcard{padding:16px 0 14px;border-bottom:1px solid var(--line)}
.fcard.fresh{animation:fin .5s ease}
@keyframes fin{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.fsign{width:100%;display:block}
.fsign .sign{height:168px;font-size:22px}
.fmeta{display:flex;align-items:center;gap:10px;margin-top:10px}
.fname{font-weight:700;font-size:15px}
.why{font-size:12px;color:var(--ink2);margin-top:2px}
.why b{color:var(--ink)}
/* in-app viewer */
.viewer{position:fixed;inset:0;z-index:25;background:#dcdad4;display:flex;justify-content:center;transform:translate3d(100%,0,0);visibility:hidden;transition:transform .46s cubic-bezier(.32,.72,0,1),visibility 0s linear .46s;will-change:transform;box-shadow:-12px 0 32px rgba(0,0,0,.08)}
.viewer.show{transform:translate3d(0,0,0);visibility:visible;transition:transform .46s cubic-bezier(.32,.72,0,1),visibility 0s}
.site.swap{animation:fadeup .34s cubic-bezier(.25,.8,.3,1)}
#view.swap{animation:fadeup .32s cubic-bezier(.25,.8,.3,1)}
@keyframes fadeup{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
.mc{transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.mc:active{transform:scale(.985)}
@media (prefers-reduced-motion:reduce){.viewer,.viewer.show,.sheet,.scrim{transition:none!important}.site.swap,#view.swap{animation:none}}
.vwrap{width:100%;max-width:1120px;height:100%;display:flex;flex-direction:column;background:var(--paper)}
.vtop{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--ink);background:var(--paper)}
.vtop .back{font-family:var(--mono);font-size:12px;border:1px solid var(--ink);border-radius:999px;padding:5px 10px;white-space:nowrap}
.vname{flex:1;min-width:0;text-align:center;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urlbar{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urlbar .lock{color:var(--ink3);margin-right:4px}
.vbody{flex:1;display:flex;min-height:0}
.site{flex:1;overflow-y:auto;min-width:0;background:#fff;-webkit-overflow-scrolling:touch}
.rail{width:84px;flex:0 0 84px;border-left:1px solid var(--ink);background:var(--paper);overflow-y:auto;display:flex;flex-direction:column;align-items:stretch;padding:10px 8px;gap:8px}
.star{border:1.5px solid var(--ink);border-radius:8px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;background:#fff}
.star .hg{width:30px;height:30px}
.star.swing .hg{animation:swing .9s ease-out;transform-origin:50% 10%}
@keyframes swing{0%{transform:rotate(0)}20%{transform:rotate(16deg)}45%{transform:rotate(-11deg)}65%{transform:rotate(6deg)}85%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
.hbtn .hg{width:15px;height:15px;vertical-align:-3px}
nav button .hg{width:20px;height:20px}
.itab{position:relative;margin-left:-9px;background:#fff;border:1.5px solid var(--ink);border-left:0;border-radius:0 10px 10px 0;padding:10px 6px 10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.itab .itl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink3)}
.itab b{font-size:13px;font-weight:800;white-space:nowrap}
.itab.on{background:#e4ff3a;}
.itab.on .itl{color:var(--ink)}
.itab.on b{font-family:var(--mono);font-size:14px}
.itab.stick{animation:stick .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes stick{0%{transform:translateX(-26px);opacity:.3}100%{transform:none;opacity:1}}
.fno{display:block;font-family:var(--mono);font-size:9.5px;font-weight:600;margin-bottom:3px}
.fav .sign{border-radius:2px}
.tool .lg{display:none}
@media (min-width:760px){.tool .lg{display:inline}.tool .sh{display:none}}
.tool.out{display:block;text-align:center;text-decoration:none;color:var(--ink);border-color:var(--ink);background:#fff}
.star.on{background:var(--ink);color:#fff}
.rail .rl{font-family:var(--mono);font-size:9.5px;color:var(--ink3);text-align:center;margin-top:6px;letter-spacing:.04em}
.fav{position:relative;display:block;width:100%}
.fav .sign{height:58px;font-size:9.5px;padding:0 4px}
.fav.cur .sign{outline:2.5px solid var(--accent);outline-offset:-2.5px}
.fav .nm{display:none}
.fav .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--new);color:#fff;font-size:12px;line-height:20px;text-align:center;display:none}
.rail.edit .fav .x{display:block}
.rail .tool{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:6px;padding:5px 2px;color:var(--ink2)}
.rail .hint{font-size:10.5px;color:var(--ink3);text-align:center;line-height:1.4;padding:4px 0}
@media (min-width:760px){
  .rail{width:280px;flex-basis:280px;padding:16px}
  .star{flex-direction:row;justify-content:center;gap:8px;font-size:14px;padding:12px}
  .star .hg{width:24px;height:24px}
  .itab{flex-direction:row;align-items:center;justify-content:space-between;padding:14px 16px 14px 20px;margin-left:-17px}
  .itab .itl{font-size:10.5px}
  .itab b{font-size:15px}
  .fno{grid-column:1/-1;margin-bottom:-4px}
  .fav{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;text-align:left}
  .fav .sign{height:46px}
  .fav .nm{display:block;font-size:13px;font-weight:700;text-align:left}
  .fav .nm small{display:block;font-family:var(--mono);font-size:10px;color:var(--ink3);font-weight:400}
  .rail .rl{text-align:left;font-size:10.5px}
}
/* mock mall site */
.ms{font-family:var(--sans);color:#1a1a1a}
.ms-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;position:sticky;top:0;background:inherit;z-index:1}
.ms-logo{font-weight:800;font-size:17px;letter-spacing:.04em}
.ms-nav{display:flex;gap:14px;padding:0 16px 12px;font-size:11.5px;letter-spacing:.06em;overflow-x:auto;white-space:nowrap}
.ms-hero{margin:0 16px;height:220px;position:relative;display:flex;align-items:flex-end;padding:16px;overflow:hidden}
.ms-hero h3{font-size:22px;font-weight:800;letter-spacing:.02em;position:relative;z-index:1}
.ms-hero p{font-size:11px;letter-spacing:.08em;position:relative;z-index:1}
.ms-hero svg{position:absolute;right:8%;top:10%;height:86%}
.ms-sec{padding:22px 16px 8px;display:flex;justify-content:space-between;align-items:baseline}
.ms-sec h4{font-size:13px;letter-spacing:.1em}
.ms-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 10px;padding:0 16px 24px}
@media (min-width:760px){.ms-grid{grid-template-columns:repeat(3,1fr)}.ms-hero{height:300px}}
.ms-p .ph{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.ms-p .ph svg{height:72%}
.ms-p .pn{font-size:12px;margin-top:6px}
.ms-p .pp{font-size:12px;font-weight:700;margin-top:2px}
.ms-p .pp s{font-weight:400;color:#999;margin-left:4px;font-size:11px}
.ms-foot{padding:20px 16px 40px;font-size:10.5px;color:#888;line-height:1.7;border-top:1px solid #e5e5e5}
.ms-ext{padding:40px 22px;text-align:center;color:var(--ink2);font-size:13px;line-height:1.7}
/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--paper);border-top:1px solid var(--ink);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:6}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3)}
nav button svg{width:20px;height:20px}
nav button.on{color:var(--ink);font-weight:700}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.42);z-index:28;opacity:0;pointer-events:none;transition:opacity .36s ease}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:var(--paper);z-index:29;border-radius:12px 12px 0 0;transition:transform .42s cubic-bezier(.32,.72,0,1);padding:10px 18px 26px}
.sheet.show{transform:translate(-50%,0)}
.grab{width:38px;height:4px;background:var(--line);border-radius:4px;margin:2px auto 14px}
.sheet h2{font-size:19px;font-weight:900;letter-spacing:-.02em;margin-bottom:4px}
.sheet .sub{font-size:12.5px;color:var(--ink2);margin-bottom:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:14px 0}
.kv dt{font-family:var(--mono);font-size:10.5px;color:var(--ink3);text-transform:uppercase;padding-top:2px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.opt{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.opt:first-of-type{border-top:0}
.check{width:22px;height:22px;border:1px solid var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px}
.check.on{background:var(--ink);color:var(--paper)}
.field{width:100%;border:1px solid var(--ink);background:#fff;padding:11px 12px;border-radius:3px;margin-bottom:10px;font-size:14px}
.themes{display:flex;gap:8px;margin:4px 0 14px}
.theme{flex:1;height:44px;border-radius:3px;border:1px solid var(--ink);font-family:var(--mono);font-size:10.5px;display:flex;align-items:flex-end;padding:4px 6px}
.theme.on{outline:2px solid var(--accent);outline-offset:2px}

/* onboarding */
.ob{position:fixed;inset:0;z-index:30;background:var(--paper);overflow-y:auto;display:none}
.ob.show{display:block}
.ob-in{max-width:440px;margin:0 auto;padding:28px 18px 110px}
.ob h1{font-size:26px;font-weight:900;letter-spacing:-.03em;line-height:1.25;margin:10px 0 8px}
.ob p{color:var(--ink2);font-size:13.5px;margin-bottom:16px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{position:relative}
.pick .sign{height:84px;font-size:12px}
.pick button.on .sign{outline:3px solid var(--accent);outline-offset:-3px}
.pick button.on::after{content:'✓';position:absolute;top:4px;left:6px;color:#fff;font-size:13px;font-weight:700}
.pick small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-top:3px;text-align:left}
.ob-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%)}

/* profile */
.prof{padding:22px 0 8px;display:flex;gap:14px;align-items:center}
.prof .av{width:58px;height:58px;font-size:20px;background:var(--ink)}
.handle{font-size:20px;font-weight:900;letter-spacing:-.02em}
.link{font-family:var(--mono);font-size:12px;color:var(--accent);word-break:break-all}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);margin:14px 0;border-radius:3px}
.stats div{padding:10px;text-align:center;border-left:1px solid var(--ink)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-size:18px;font-weight:900}
.stats span{font-family:var(--mono);font-size:10px;color:var(--ink3)}

.subbtn.pop .hg{animation:envpop 1s .08s;will-change:transform;backface-visibility:hidden;transform-origin:50% 65%}
@keyframes envpop{0%{transform:scale(1) rotate(0);animation-timing-function:cubic-bezier(.33,0,.3,1)}30%{transform:scale(1.12) rotate(-7deg);animation-timing-function:cubic-bezier(.22,.8,.36,1)}100%{transform:scale(1) rotate(0)}}
@media (min-width:760px){.subbtn.sq .hg{width:27px;height:27px}}

/* ── 통일: 홈 카드 톤에 맞춘 다른 탭들 ── */
main, main *{font-family:"Noto Sans KR",sans-serif}
main .sec{padding:18px 0 6px}
main .sec-h{align-items:center;margin-bottom:14px}
main .sec-h h2{font-size:15px;font-weight:700;letter-spacing:-.01em;color:#fff}
main .label{font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;color:#fff}
main .empty{background:#fff;border:0;border-radius:0;color:#555;font-size:13px;line-height:1.7;padding:26px 18px;box-shadow:0 14px 30px -18px rgba(120,40,60,.6)}
main .btn{border-radius:999px;font-size:13px;font-weight:500;padding:10px 16px;background:#fff;color:#c9708a;border:1px solid #fff}
main .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.9)}
main .bcard .btn{background:#eba3b8;color:#fff;border-color:#eba3b8}
main .bcard .btn.ghost{background:transparent;color:#1c1b19;border-color:#d9d4ce}
main .addbox{margin:0 0 14px}
main .addbox input,main .field{border:0;border-radius:999px;background:#fff;padding:11px 16px;font-size:13px;color:#1c1b19}
main .addbox input::placeholder,main .field::placeholder{color:#aaa}
main .bcard{background:#fff;border:0;border-radius:0;padding:14px;margin-bottom:14px;box-shadow:0 14px 30px -18px rgba(120,40,60,.6)}
main .bcard h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
main .bcard .label{color:#9a948d}
main .grid{gap:14px}
main .grid .item{background:#fff;padding:10px 10px 0;box-shadow:0 14px 30px -18px rgba(120,40,60,.6)}
main .grid .item .meta{color:#555;font-size:12px;padding:9px 2px 11px;margin:0}
main .grid .item .meta button{color:#555}
main .prof{padding:18px 0 8px}
main .handle{font-size:18px;font-weight:700;letter-spacing:-.01em}
main .link{font-size:12px}
main .stats{background:#fff;border:0;border-radius:0;margin:16px 0 14px;box-shadow:0 14px 30px -18px rgba(120,40,60,.6)}
main .stats div{border:0;padding:14px 8px}
main .stats b{font-size:17px;font-weight:700;color:#1c1b19}
main .stats span{font-size:11px;color:#9a948d;letter-spacing:0}
main .note{font-size:12px;line-height:1.6;color:#fff;opacity:.95}

/* ── 바닥은 네모칸 대신 점선 ── */
main .empty{background:transparent;box-shadow:none;color:#fff;border:0;border-top:1px dashed rgba(255,255,255,.85);border-bottom:1px dashed rgba(255,255,255,.85);padding:22px 0}
main .stats{background:transparent;box-shadow:none;border:0;border-top:1px dashed rgba(255,255,255,.85);border-bottom:1px dashed rgba(255,255,255,.85)}
main .stats div{border-left:1px dashed rgba(255,255,255,.85)}
main .stats div:first-child{border-left:0}
main .stats b{color:#fff}
main .stats span{color:#fff;opacity:.9}
main .bcard{background:transparent;box-shadow:none;border:0;border-bottom:1px dashed rgba(255,255,255,.85);padding:16px 0;margin:0}
main .bcard:first-of-type{border-top:1px dashed rgba(255,255,255,.85)}
main .bcard h3,main .bcard .label{color:#fff}
main .bcard .btn{background:#fff;color:#c9708a;border-color:#fff}
main .bcard .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.9)}
main .bcard .mini .sign{background:#fff;color:#1c1b19;font-weight:500;border-radius:0}

/* ── 내 인덱스: 점선 리스트 ── */
.ix-list{margin-top:6px;border-top:0}
.ix-row{display:flex;align-items:center;gap:4px;border-bottom:1px dashed rgba(255,255,255,.85);overflow:hidden;transition:opacity .3s ease,height .34s cubic-bezier(.32,.72,0,1),transform .3s ease}
.ix-row.out{opacity:0;height:0 !important;transform:translateX(12px);border-bottom-color:transparent}
.ix-name{flex:1;min-width:0;text-align:left;padding:18px 0;font-size:14px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ix-ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#fff;-webkit-tap-highlight-color:transparent}
.ix-ic .hg{width:21px;height:21px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.ix-ic:active .hg{transform:scale(.82);transition:transform .07s ease-out}
.ix-env:not(.on) .hg{opacity:.75}
.ix-env.pop .hg{animation:envpop 1s .02s;transform-origin:50% 65%}
.contact{margin-top:18px;padding:30px 4px 26px;border-bottom:1px dashed rgba(255,255,255,.85);text-align:center;color:#fff}
.contact .c-emoji{font-size:27px;line-height:1;margin-bottom:16px}
.contact p{font-size:13px;line-height:1.8;margin:0 0 12px;word-break:keep-all}
.contact .c-mail{margin-top:14px;font-size:15px;font-weight:700;letter-spacing:.01em;color:#fff;user-select:all;-webkit-user-select:all}
.share{padding:26px 4px;border-bottom:1px dashed rgba(255,255,255,.85);text-align:center}
.share .s-btn{padding:7px 15px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.75);color:#fff;font-size:12px;font-weight:500}
.contact .c-copy{margin-top:8px;font-size:12px;color:#fff;text-decoration:underline;text-underline-offset:3px;opacity:.9}
.ix-empty{margin-top:18px;padding:22px 0;border-top:1px dashed rgba(255,255,255,.85);border-bottom:1px dashed rgba(255,255,255,.85);text-align:center;color:#fff;font-size:13px;line-height:1.7}
.ix-row>*{transition:opacity .3s ease}
.ix-row.pending>*{opacity:.2;transition:opacity 3s cubic-bezier(.4,0,.6,1)}
.ix-row.pending{border-bottom-color:rgba(255,255,255,.35);transition:border-color 3s ease,opacity .3s ease,height .34s cubic-bezier(.32,.72,0,1),transform .3s ease}
.ix-heart.pop .hg{animation:hop .85s cubic-bezier(.3,.7,.3,1)}

/* ── 인덱스: 핀 · 새 창 · 꾹 눌러 옮기기 ── */
.ix-row{position:relative;background:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.ix-row .ix-pin{width:30px;margin-left:-6px}
.ix-row .ix-pin .hg{width:19px;height:19px;transform:rotate(45deg);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.ix-row .ix-pin:active .hg{transform:rotate(45deg) scale(.82)}
.ix-pin:not(.on) .hg{opacity:.7}
.ix-ext .hg{width:19px;height:19px}
.ix-ext.off{opacity:.3}
.ix-row.lift{z-index:3;transition:box-shadow .2s ease,background .2s ease !important;background:rgba(255,255,255,.18);box-shadow:0 14px 30px -14px rgba(120,40,60,.55);border-bottom-color:transparent}
body.ix-dragging{-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body.ix-dragging .ix-list{touch-action:none}
.ix-row *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ix-row a,.ix-row img{-webkit-user-drag:none}
.ix-name{display:block;text-decoration:none}

/* 상세 레일: 새 창 · 인스타 (인덱스 아이콘과 통일) */
.rail .rlink{color:#fff;text-decoration:none;-webkit-tap-highlight-color:transparent}
.rail .rlink .hg{width:26px;height:26px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.rail .rlink:active .hg{transform:scale(.82);transition:transform .07s ease-out}
.rail .rlink.off{opacity:.3}
.rail .rlink + .rlink{margin-top:-4px}

html.p1 #newsBtn,html.p1 .rail .subbtn,html.p1 .rail .subbtn + .rdiv,html.p1 .ix-env{display:none}
html.p1 nav{grid-template-columns:repeat(3,1fr)}

/* ── 1차: 상세 = 무드 이미지 + 상단 액션 ── */
html.p1 .rail{display:none}
.vact{display:flex;align-items:center;justify-content:flex-end}
html.p1 .vtop{display:grid;grid-template-columns:1fr auto 1fr}
html.p1 .vnav{justify-self:start}
html.p1 .vname{max-width:46vw}
.vact .vic{width:34px;height:36px;color:#fff;text-decoration:none;-webkit-tap-highlight-color:transparent}
.vact .vic .hg{width:22px;height:22px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.vact .vic:active .hg{transform:scale(.82);transition:transform .07s ease-out}
.vact .vic.off{opacity:.3}
.vact .va-heart.pop .hg{animation:hop .85s cubic-bezier(.3,.7,.3,1)}
/* 하트 위치 안내(처음 3번만): 검은 하트가 한 번 커졌다 작아져요 */
.vact .va-heart{position:relative}
/* 상단 바 아래 얇은 핑크 띠: 안내만 해요(눌러도 반응 없음). 이동은 위쪽 ↗ 아이콘으로 */
.vstrip{display:flex;align-items:center;justify-content:center;gap:3px;pointer-events:none;user-select:none;-webkit-user-select:none;height:28px;flex:0 0 28px;background:var(--f1);color:var(--fx-fg);font:400 11.5px/1 Inter,"Noto Sans KR",sans-serif;letter-spacing:-.01em;text-decoration:none;-webkit-tap-highlight-color:transparent}
.vstrip[hidden]{display:none}
.vstrip .hg{width:13px;height:13px}
.vstrip .vs-emo{font-size:13px;line-height:1;margin-right:1px}
.vact .va-heart.hint .hg{animation:hintBeat 1.2s cubic-bezier(.45,0,.55,1) 1}
@keyframes hintBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.vact .va-heart.hint .hg{animation:none}}
html.p1 .site{background:transparent;position:relative}
.bp-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.bp{padding:18px 18px 40px}
.bp-img{background:#fff;padding:10px;box-shadow:0 14px 30px -18px rgba(120,40,60,.6)}
.bp-img svg,.bp-img img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover}
.bp-go{display:block;margin:22px auto 0;width:max-content;padding:11px 26px;border-radius:999px;background:#fff;color:#c9708a;font-size:13px;font-weight:500;text-decoration:none}
.mc-img img{display:block;width:100%;height:100%;object-fit:cover}

/* ── 하트 탭: 계정 안내 (목록 맨 아래) ── */
.acct{margin:26px 0 10px;padding:22px 0 4px;text-align:center;color:#fff}
.acct p{font-size:13px;line-height:1.7;margin:0 0 16px;color:#fff}
.acct-btns{display:flex;flex-direction:column;gap:8px;align-items:center}
.sso{position:relative;display:flex;align-items:center;justify-content:center;width:100%;max-width:290px;height:42px;border-radius:999px;font-size:13px;font-weight:500;background:#fff;color:#1c1b19;border:0;-webkit-tap-highlight-color:transparent;transition:transform .15s ease}
.sso svg{position:absolute;left:18px;top:50%;transform:translateY(-50%)}
.sso:active{transform:scale(.98)}
.acct.on{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;padding:0;font-size:12px;text-align:left}
.acct-act{display:flex;gap:12px}
.acct-pp{display:inline-block;margin-top:14px;font-size:11px;color:#fff;opacity:.75;text-decoration:underline;text-underline-offset:3px}
.pp-link{display:block;text-align:center;margin:22px 0 4px;font-size:11px;color:#fff;opacity:.75;text-decoration:underline;text-underline-offset:3px}
.acct.on button{color:#fff;font-size:12px;text-decoration:underline;text-underline-offset:3px;opacity:.9}
.ix-ig .hg{width:19px;height:19px}
.ix-row .ix-ic{width:36px}
.ix-name{cursor:grab}

/* ===================== FOLDER SKIN (10-2) ===================== */
:root{--fx-bg:#fff;--fx-fg:#1b1b1b;--f1:#f8bdd8;--f2:#ef93c0;--pk:#e0559b;--fx-mu:#9a9a9a;--fx-soft:#fdf2f7}
html,body{background:#fff}
html.p1 body{background:#fff}
#app{background:#fff;color:var(--fx-fg)}
main, main *{font-family:Inter,"Noto Sans KR",sans-serif}
.fx-pl{display:inline-flex;align-items:center;gap:4px;border:1.3px solid var(--fx-fg);border-radius:999px;padding:2px 10px;font:400 14px/1.25 Inter,"Noto Sans KR",sans-serif;letter-spacing:-.02em;white-space:nowrap;color:var(--fx-fg);background:transparent}
.fx-pl.s{font-size:12px;padding:1px 8px}
.fx-pl.pk{border-color:var(--pk);color:var(--pk)}
.fx-ci{width:28px;height:28px;border:1.3px solid var(--fx-fg);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--fx-fg)}
.fx-par{font:200 34px/.9 Inter,sans-serif;color:var(--fx-fg)}
header{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:10;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:0;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;align-items:center}
#app{padding-top:var(--hh,56px)}
/* 상단은 그대로 두고 그 아래 영역만 스크롤 (페이지 전체는 움직이지 않음) */
html.p1,html.p1 body{height:100%;overflow:hidden}
html.p1 #app{height:100vh;height:100dvh;min-height:0;padding:0;display:flex;flex-direction:column}
html.p1 header{position:relative;top:auto;left:auto;transform:none;-webkit-transform:none;width:100%;max-width:none;flex:0 0 auto}
html.p1 main#view{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
html.p1 #favBtn{display:none}
header{will-change:transform;-webkit-transform:translateX(-50%) translateZ(0);transform:translateX(-50%) translateZ(0)}
.fx-hl{display:flex;align-items:center;gap:6px}
.hbtn,#favBtn{background:transparent;border:1.3px solid var(--pk);color:var(--pk);font:400 14px Inter,sans-serif;padding:2px 10px;border-radius:999px;display:flex;align-items:center;gap:4px}
#favBtn .hg{width:13px;height:13px}
main{padding:0 10px}
.fx-intro{font-size:12.5px;font-weight:300;line-height:1.55;letter-spacing:-.01em;padding:22px 6px 26px 4px;color:var(--fx-fg);word-break:keep-all}
.fx-intro em{font-style:normal;color:var(--pk)}
.fx-sec{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:0 0 26px;align-items:start}
.fx-grow{display:flex;align-items:flex-start;gap:4px}
.fx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 2px;flex:1}
.fx-grid.fx-new{display:flex;flex-wrap:wrap;flex:0 1 auto;gap:16px 2px;min-width:0}
.fx-new .fx-fd{width:calc((100vw - 120px)/3);max-width:100px}
#feed{padding-top:0}
.fcard.fx-fd{background:none;box-shadow:none;transform:none;margin:0;padding:0;border:0;color:var(--fx-fg)}
.fx-fb{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;text-align:center;font-size:10.5px;line-height:1.25;letter-spacing:-.01em;color:var(--fx-fg)}
.fx-fdw{position:relative;width:64px;height:52px;display:block}
.fx-peek{position:absolute;left:13px;top:-7px;width:38px;height:44px;overflow:hidden;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transform:rotate(-5deg);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.fx-peek img{display:block;width:100%;height:100%;object-fit:cover}
.fx-fb:active .fx-peek{transform:rotate(-1deg) translateY(-9px)}
@media (hover:hover){.fx-fb:hover .fx-peek{transform:rotate(-1deg) translateY(-9px)}}
.fx-fdw .fx-fo{position:absolute;left:0;bottom:0;width:64px;height:50px}
.fx-st{position:absolute;right:-2px;bottom:4px;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--pk);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.15);transform:scale(0);transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.fx-st.on{transform:scale(1)}
.fx-st svg{width:12px;height:12px}
.fx-fn{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.fx-pgn{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 20px;font-size:14px;color:var(--fx-fg)}
/* nav */
nav,html.p1 nav{background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:0;display:flex;justify-content:center;align-items:center;gap:8px;padding:20px 0 calc(24px + env(safe-area-inset-bottom))}
#app{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
nav .fx-par{font-size:28px}
nav button.fx-pl{display:inline-flex;flex-direction:row;font-size:13px;padding:6px 15px;color:var(--fx-fg)}
nav button.fx-pl.on{background:var(--fx-fg);color:#fff;font-weight:400}
.fx-cnt{display:inline-flex;min-width:17px;height:17px;border-radius:9px;background:var(--pk);color:#fff;font-size:10px;font-weight:700;align-items:center;justify-content:center;padding:0 4px;margin-left:2px}
nav button.fx-pl.on .fx-cnt{background:#fff;color:var(--fx-fg)}
/* index tab */
.fx-ixh{padding:22px 4px 18px;font-size:12.5px;font-weight:300;line-height:1.6;letter-spacing:-.01em;color:var(--fx-fg)}
.fx-ico{display:inline-flex;vertical-align:-3px}
.fx-ico .hg{width:15px;height:15px}
.fx-ixh small{display:block;font-size:12.5px;color:var(--fx-mu);margin-top:4px}
.ix-list{margin:0 -10px}
.ix-row{border-bottom:1px solid #f3f3f3;padding:0 6px 0 12px;gap:2px}
.ix-row:nth-child(odd){background:var(--fx-soft)}
.ix-row.pending{border-bottom-color:#f3f3f3}
.ix-row.lift{background:#fff;box-shadow:0 14px 30px -14px rgba(160,40,90,.4)}
.fx-rf{flex:0 0 28px;display:flex;cursor:pointer}
.fx-rf .fx-fo{width:26px;height:21px}
.ix-name{color:var(--fx-fg);font-size:13.5px;font-weight:400;padding:9px 0 9px 6px;cursor:pointer}
.ix-name small{display:block;font-size:10px;color:var(--fx-mu);margin-top:1px}
.ix-ic{color:var(--fx-fg)}
.ix-row .ix-ic{width:34px}
.ix-ic .hg{width:18px !important;height:18px !important}
.ix-pin:not(.on) .hg{opacity:.35}
.ix-row .ix-pin.on .hg{color:var(--pk)}
.ix-row .ix-pin.on .hg path{fill:var(--pk)}
.ix-empty{border:0;color:var(--fx-fg);font-size:12.5px;font-weight:300;line-height:1.55;letter-spacing:-.01em;word-break:keep-all;margin-top:0;padding:0 0 18px}
/* 빈 인덱스: 폴더·문구·로그인 버튼을 화면 가운데로 */
.ix-emptywrap{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;padding:24px 0}
.fx-bigf{width:64px;height:50px;display:block;margin:0 auto 12px}
.acct{margin:30px 4px 10px;padding:0;border:0;color:var(--fx-fg)}
.acct p{color:var(--fx-fg);font-size:12.5px;font-weight:300;line-height:1.6;letter-spacing:-.01em}
.sso{background:#fff;border:1.3px solid var(--fx-fg);height:40px}
.acct-pp,.pp-link{color:var(--fx-mu);opacity:1}
.acct.on{border:0;padding:0;margin:16px 4px 6px;justify-content:flex-end}
.my{padding:26px 6px 6px;color:var(--fx-fg)}
.my .acct{margin:22px 0 0}
.my-mail{font-size:16px;letter-spacing:-.02em;margin:18px 0 4px;word-break:break-all}
.my-sub{font-size:12px;color:var(--fx-mu);margin:0 0 20px}
.my-stat{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 24px}
.me-av{width:28px;height:28px;border-radius:50%;overflow:hidden;padding:0;border:1.3px solid #cfcfcf;background:#f2f2f2;color:#c4c4c4;display:inline-flex;align-items:flex-end;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.me-av svg{width:100%;height:100%;display:block}
.me-av.on{border-color:var(--pk);background:var(--f1);color:#fff}
.me-av:active{transform:scale(.92)}
header{overflow:visible}
.me-pop{position:absolute;top:calc(100% - 4px);right:12px;width:236px;background:#fff;border:1.3px solid var(--fx-fg);border-radius:14px;padding:16px 14px 14px;box-shadow:0 12px 30px -12px rgba(0,0,0,.25);z-index:20;text-align:center}
.me-pop[hidden]{display:none}
.me-t{font-size:12.5px;font-weight:300;line-height:1.55;color:var(--fx-fg);margin:0 0 6px}
.me-mail{font-size:12px;color:var(--fx-mu);margin:0 0 12px;word-break:break-all}

@keyframes bubUp{0%{transform:translateY(10px) scale(.5)}30%{transform:translateY(-2px) scale(1.12)}50%{transform:translateY(0) scale(1)}75%{transform:translateY(-3px) scale(1.04)}100%{transform:translateY(0) scale(1)}}

.fx-ck.show svg path{animation:ckdraw .38s .1s cubic-bezier(.4,0,.2,1) forwards}

async function renderExp(i,fmt){
  $('#fmtS')?.classList.toggle('on',fmt==='story'); $('#fmtF')?.classList.toggle('on',fmt==='feed');
  try{await document.fonts.ready;}catch(e){}
  const b=STATE.boards[i], T=THEMES[b.theme], W=1080, H=fmt==='story'?1920:1350;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle=T.bg; x.fillRect(0,0,W,H);
  const P=84, SANS='"Noto Sans KR","Apple SD Gothic Neo",sans-serif', MONO='"Noto Sans KR",sans-serif';
  x.fillStyle=T.ink; x.font=`500 30px ${MONO}`; x.textBaseline='top';
  x.fillText('POCKET INDEX  /  "MALL BOARD"',P,P);
  x.fillRect(P,P+52,W-2*P,3);
  // title wrap
  x.font=`900 ${fmt==='story'?92:80}px ${SANS}`;
  const words=b.t.split(' '); let line='', lines=[];
  words.forEach(w=>{const t=line?line+' '+w:w; if(x.measureText(t).width>W-2*P&&line){lines.push(line);line=w;} else line=t;}); lines.push(line);
  lines=lines.slice(0,3);
  let y=P+(fmt==='story'?110:90);
  const lh=fmt==='story'?108:94;
  lines.forEach(l=>{x.fillText(l,P,y); y+=lh;});
  // grid
  const ms=b.m.slice(0,9).map(byId).filter(Boolean), n=ms.length;
  const cols=n<=4?2:3, rows=Math.ceil(n/cols), gap=18;
  const gw=W-2*P, cw=(gw-gap*(cols-1))/cols;
  const top0=y+40, bottom=H-P-150;
  const ch=Math.min(cw*(fmt==='story'?1.05:.62),(bottom-top0-gap*(rows-1))/rows);
  const top=top0+Math.max(0,(bottom-top0-(rows*ch+gap*(rows-1)))/2);
  ms.forEach((m,k)=>{
    const cx=P+(k%cols)*(cw+gap), cy=top+Math.floor(k/cols)*(ch+gap);
    x.fillStyle=T.sign; x.fillRect(cx,cy,cw,ch);
    x.fillStyle=T.signInk; x.textAlign='center'; x.textBaseline='middle';
    let fs=cols===2?54:40; x.font=`700 ${fs}px ${SANS}`;
    while(x.measureText(m.name).width>cw-36&&fs>22){fs-=2;x.font=`700 ${fs}px ${SANS}`;}
    x.fillText(m.name,cx+cw/2,cy+ch/2);
    x.font=`500 20px ${MONO}`; x.globalAlpha=.6; x.fillText(String(k+1).padStart(2,'0'),cx+cw/2,cy+ch-34); x.globalAlpha=1;
  });
  x.textAlign='left'; x.textBaseline='alphabetic'; x.fillStyle=T.ink;
  x.fillRect(P,H-P-96,W-2*P,3);
  x.font=`700 40px ${SANS}`; x.fillText('@'+STATE.handle,P,H-P-30);
  x.font=`500 28px ${MONO}`; x.textAlign='right'; x.fillText('POCKET INDEX',W-P,H-P-34);
  $('#expImg').src=c.toDataURL('image/png');
}

  return r.json();
}
/* 카카오에서 돌아왔을 때(?code=…&state=…) 처리 */
async function finishKakao(){
  const p=new URLSearchParams(KAKAO_CB||''), code=p.get('code'), err=p.get('error'), st=p.get('state'); KAKAO_CB='';
  if(!code&&!err) return;
  let saved={}; try{ saved=JSON.parse(localStorage.getItem('pi-kakao')||'{}'); localStorage.removeItem('pi-kakao'); }catch(e){}
  if(saved.tab){ TAB=saved.tab; }
  if(err||!saved.state||st!==saved.state){ if(err!=='access_denied') loginFail(err?('K-'+err):(!saved.state?'S0':'S1')); render(); return; }
  try{
    const t=await kakaoToken(code);
    if(!t.id_token) throw new Error('T-'+(t.error_code||t.error||'no-id-token'));
    const {error}=await AUTH.sb.auth.signInWithIdToken({provider:'kakao',token:t.id_token,access_token:t.access_token,nonce:saved.nonce});
    if(error) throw new Error('A-'+(error.code||error.status||'')+' '+(error.message||''));
    const {data:ses}=await AUTH.sb.auth.getSession(); const uid=ses&&ses.session?ses.session.user.id:'';
    ga('login',{method:'kakao',account_id:uid||'unknown',login_state:'member'});
  }catch(e){ console.warn('kakao login',e); ga('login_fail',{method:'kakao',reason:String(e&&e.message||e).slice(0,40)}); loginFail(String(e&&e.message||e)); render(); }
}
/* 로그인 실패 안내: 원인 확인용 짧은 코드를 함께 보여줘요 */
function loginFail(code){ const el=$('#toast'); toast('로그인하지 못했어요 ('+code.slice(0,60)+')'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),6000);
}
/* 로그아웃하면 이 브라우저에 남은 목록을 비워요. 계정에 이미 저장돼 있으니 다음 로그인 때 그대로 돌아와요.
   (안 비우면 같은 브라우저에서 다른 사람이 로그인할 때 앞사람 하트가 섞여요) */
function clearLocalList(){ STATE.bm=[]; STATE.pins=[]; STATE.subs={}; STATE.no={}; STATE.nextNo=1; try{localStorage.setItem(KEY,JSON.stringify(STATE));}catch(e){} }
/* 회원 탈퇴: DB 함수 delete_my_account()가 계정을 지우면 user_state(하트)도 함께 지워져요 */
async function deleteAccount(){ if(!AUTH.sb||!AUTH.user) return;
  if(!confirm('탈퇴하면 계정과 계정에 저장된 하트가 모두 지워지고, 되돌릴 수 없어요.\n정말 탈퇴할까요?')) return;
  clearTimeout(SYNC_T); SYNC_READY=false;
  /* 서버 기능(delete-account)이 카카오 연결 끊기 + 계정 삭제를 함께 해요. 없으면 계정 삭제만 해요 */
  let error=null, kakao='';
  try{ const r=await AUTH.sb.functions.invoke('delete-account',{method:'POST'}); if(r.error||!r.data||!r.data.ok) throw r.error||new Error('fn'); kakao=r.data.kakao||''; }
  catch(e){ let why=''; try{ why=e&&e.context&&e.context.status?String(e.context.status):String(e&&e.name||e).slice(0,20); }catch(_){}
    ({error}=await AUTH.sb.rpc('delete_my_account')); kakao='fallback-'+why; }
  if(error){ toast('탈퇴하지 못했어요. 잠시 후 다시 시도해 주세요'); return; }
  ga('account_delete_detail',{reason:kakao});
  ga('account_delete');
  AUTH.user=null; try{ await AUTH.sb.auth.signOut({scope:'local'}); }catch(e){}
  clearLocalList(); drawFav(); render(); toast('탈퇴가 완료됐어요. 그동안 고마웠어요');
}
async function signOut(){ if(!AUTH.sb) return; ga('logout'); await flushSync(); SYNC_READY=false; try{ gtag('set',{user_id:null}); }catch(e){} AUTH.sb.auth.signOut().then(()=>{ AUTH.user=null; clearLocalList(); render(); }); }
/* 서버 ↔ 기기 합치기: 서버 순서 먼저, 이 기기에만 있던 건 뒤에 */
function mergeIn(remote){
  const r=remote||{}, rb=(r.bm||[]), rp=(r.pins||[]);
  STATE.bm=[...rb, ...STATE.bm.filter(id=>!rb.includes(id))];
  STATE.pins=[...rp, ...(STATE.pins||[]).filter(id=>!rp.includes(id))];
  STATE.subs=Object.assign({},r.subs||{},STATE.subs||{});
}
/* 계정 저장. SYNC_READY: 서버 목록을 먼저 받아 합친 뒤에만 저장해요(빈 목록으로 덮어쓰기 방지) */
var SYNC_T=null, SYNC_OFF=false, SYNC_READY=false;
function syncUp(){ if(!AUTH||SYNC_OFF||!SYNC_READY||!AUTH.user||!AUTH.sb) return; clearTimeout(SYNC_T);
  const uid=AUTH.user.id;
  SYNC_T=setTimeout(()=>{ if(!AUTH.user||AUTH.user.id!==uid) return;
    /* supabase 요청은 then/await 해야 실제로 전송돼요 */
    AUTH.sb.from('user_state').upsert({user_id:uid,state:{bm:STATE.bm,pins:STATE.pins||[],subs:STATE.subs||{}},updated_at:new Date().toISOString()})
      .then(({error})=>{ if(error){ console.warn('sync',error); ga('sync_fail',{reason:String(error.code||error.message).slice(0,40)}); } });
  },600); }
/* 로그아웃 직전에 남은 저장을 바로 보내요 */
async function flushSync(){ if(!SYNC_T||!SYNC_READY||!AUTH.user||!AUTH.sb) return; clearTimeout(SYNC_T); SYNC_T=null;
  try{ await AUTH.sb.from('user_state').upsert({user_id:AUTH.user.id,state:{bm:STATE.bm,pins:STATE.pins||[],subs:STATE.subs||{}},updated_at:new Date().toISOString()}); }catch(e){} }
async function onSignedIn(user){
  try{ gtag('set',{user_id:user.id}); }catch(e){}
  SYNC_READY=false; AUTH.user=user;
  const {data,error}=await AUTH.sb.from('user_state').select('state').eq('user_id',user.id).maybeSingle();
  if(error){ console.warn('load',error); ga('sync_fail',{reason:'load '+String(error.code||error.message).slice(0,34)}); render(); drawFav(); return; } /* 못 불러오면 저장도 하지 않아요 */
  SYNC_OFF=true; mergeIn(data&&data.state); save(); SYNC_OFF=false; SYNC_READY=true; syncUp(); render(); drawFav();
}
function initAuth(){
  /* 미리보기: 실서비스 도메인이 아닌 곳(아티팩트 등)에서는 연결 전이어도 화면만 보여줘요. 버튼은 동작하지 않아요 */
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY){ if(!/pocket-index\.com$/.test(location.hostname)){ AUTH.ready=true; AUTH.preview=true; } return; }
  /* 버전을 고정하고 무결성(SRI)을 확인해요. 버전을 올릴 땐 integrity 값도 같이 바꿔야 해요 */
  const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js';
  sc.integrity='sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O'; sc.crossOrigin='anonymous';
  sc.onload=async()=>{ try{
      AUTH.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{detectSessionInUrl:false}});
      AUTH.ready=true;
      await finishKakao();
      const {data}=await AUTH.sb.auth.getSession();
      if(data&&data.session) await onSignedIn(data.session.user); else render();
      AUTH.sb.auth.onAuthStateChange((ev,ses)=>{ if(ev==='SIGNED_IN'&&ses&&(!AUTH.user||AUTH.user.id!==ses.user.id)) onSignedIn(ses.user); if(ev==='SIGNED_OUT'&&AUTH.user){ SYNC_READY=false; AUTH.user=null; clearLocalList(); render(); } });
    }catch(e){} };
  document.head.appendChild(sc);
}
render(); loadBrands(); initAuth();
const setHH=()=>{ document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px'); document.documentElement.style.setProperty('--nh',document.querySelector('nav').offsetHeight+'px'); }; setHH(); addEventListener('resize',setHH);
</script>
